<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="logo">Asset<span>Pass</span></h1>
      <p class="subtitle">Registro de Empresa y Administrador</p>
    </div>

    @if (successMessage()) {
      <div class="alert alert-success">
        {{ successMessage() }}
      </div>
    }

    @if (errorMessage()) {
      <div class="alert alert-danger">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <h3 class="section-title">Datos de la Empresa</h3>

      <div class="form-group">
        <label for="commercialName">Nombre Comercial *</label>
        <input id="commercialName" type="text" formControlName="commercialName" placeholder="Mi Empresa S.R.L." />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Teléfono *</label>
          <input id="phone" type="text" formControlName="phone" placeholder="809-555-0100" />
        </div>
        <div class="form-group">
          <label for="companyEmail">Correo Empresa *</label>
          <input id="companyEmail" type="email" formControlName="companyEmail" placeholder="contacto@empresa.com" />
        </div>
      </div>

      <h3 class="section-title">Administrador Principal (Owner)</h3>

      <div class="form-row">
        <div class="form-group">
          <label for="adminFirstName">Nombre *</label>
          <input id="adminFirstName" type="text" formControlName="adminFirstName" placeholder="Juan" />
        </div>
        <div class="form-group">
          <label for="adminLastName">Apellido *</label>
          <input id="adminLastName" type="text" formControlName="adminLastName" placeholder="Pérez" />
        </div>
      </div>

      <div class="form-group">
        <label for="adminEmail">Correo Administrador *</label>
        <input id="adminEmail" type="email" formControlName="adminEmail" placeholder="juan@empresa.com" />
      </div>

      <div class="form-group">
        <label for="adminPassword">Contraseña *</label>
        <input id="adminPassword" type="password" formControlName="adminPassword" placeholder="••••••••" />
        <span class="hint-text">Mínimo 8 caracteres, mayúscula, minúscula, número y símbolo.</span>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span>Registrando...</span>
        } @else {
          <span>Crear Cuenta de Empresa</span>
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Iniciar Sesión</a></p>
    </div>
  </div>
</div>
